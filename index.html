          { "@type": "Offer", "name": "One Page Website", "priceCurrency": "THB", "price": "8000" },

    <script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "How long does a website take?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Most projects take approximately 3–14 business days once all required content has been received. Timing depends on the size and complexity of the project."
      }
    },
    {
      "@type": "Question",
      "name": "Do I own my website?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Once the project has been fully paid, the final website deliverables are yours, subject to any third-party services, tools or licenses used by the website."
      }
    },
    {
      "@type": "Question",
      "name": "Who pays for the domain?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "The domain is purchased and owned by the client. We can guide you through the setup and connect it to your website."
      }
    },
    {
      "@type": "Question",
      "name": "Can you update my website after launch?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Optional Website Care is available from 1,500 THB/month for ongoing support and small updates."
      }
    },
    {
      "@type": "Question",
      "name": "Can you build a bilingual website?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Multilingual websites can be included depending on the project and package."
      }
    },
    {
      "@type": "Question",
      "name": "Do you work with businesses outside Thailand?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Motion Digital Studio is based in Thailand and works with businesses worldwide."
      }
    }
  ]
}
