<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="apple-touch-icon" href="/brand/icon-180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Motion Digital Studio" />
    <meta property="og:title" content="Motion Digital Studio — Websites that move business forward." />

      property="og:description"
      content="Modern, high-performance websites designed to turn visitors into customers and businesses into stronger brands."

    <link rel="preload" as="image" type="image/avif" href="/brand/motion-logo-480.avif" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Motion Digital Studio",
        "slogan": "Websites that move business forward.",
        "description": "Web design and development studio creating modern, high-performance websites for businesses worldwide.",

        "image": "https://motiondigitalstudio.com/brand/og-image.jpg",
        "areaServed": "Worldwide",
        "address": { "@type": "PostalAddress", "addressCountry": "TH" },

          { "@type": "Offer", "name": "One Page Website", "priceCurrency": "THB", "price": "8000" },
          { "@type": "Offer", "name": "Multi Page Website", "priceCurrency": "THB", "price": "15000" },
          { "@type": "Offer", "name": "Premium Website", "priceCurrency": "THB", "price": "25000" }
        ]
